});
$("formatPanel").addEventListener("click", e => {
  const b = e.target.closest("[data-fp]");
  if (!b) return;
  if (b.dataset.fp === "save") closeFormat(true);
  else if (b.dataset.fp === "cancel") closeFormat(false);
  else if (b.dataset.fp === "defaults") { setFormat({ ...DEFAULT_FORMAT }); const keep = savedFormat; openFormat(); savedFormat = keep; }
});
$("btnFormat").onclick = openFormat;

/* ---------- Excel export: exactly what's on screen ---------- */
function loadXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((resolve, reject) => {
    const sc = document.createElement("script");
    sc.src = "./xlsx.full.min.js";
    sc.onload = () => resolve(window.XLSX);
    sc.onerror = () => reject(new Error("the Excel library (xlsx.full.min.js) didn't load"));
    document.head.appendChild(sc);
  });
}

async function exportExcel() {
  if (!model || !layout) return;
  const btn = $("btnExport");
  btn.disabled = true;
  try {
    const XLSX = await loadXlsx();
    const g = buildGrid();
    const { rowLv, colLv, rowItems, colItems, text } = g;
    const nRH = Math.max(rowLv.length, 1), nCH = Math.max(colLv.length, 1);
    const title = worksheet ? worksheet.name : "Pivot Grid";
    const now = new Date();
    const aoa = [[title], ["Exported " + now.toLocaleString()], []];
    const merges = [], top = aoa.length;
    const merge = (r, c, rows, cols) => { if (rows > 1 || cols > 1) merges.push({ s: { r, c }, e: { r: r + rows - 1, c: c + cols - 1 } }); };

    const cFD = firstDiff(colItems.map(c => c.t)), rFD = firstDiff(rowItems.map(r => r.t));
    for (let L = 0; L < nCH; L++) {
      const row = new Array(nRH + colItems.length).fill(null);
      row[0] = colLv[L] ? levelName(colLv[L]) : "";
      merge(top + L, 0, 1, nRH);
      const runs = runLens(cFD, L);
      for (let c = 0; c < colItems.length; c++) {
        if (!runs[c]) continue;
        row[nRH + c] = colLv.length ? text(colLv, colItems[c], L) : "";
        merge(top + L, nRH + c, 1, runs[c]);
      }
      aoa.push(row);
    }
    aoa.push(rowLv.map(levelName));
    const rRuns = rowLv.map((_, i) => runLens(rFD, i));
    rowItems.forEach((it, r) => {
      const row = [];
      const at = aoa.length;
      for (let i = 0; i < nRH; i++) {
        if (!rowLv.length) { row.push(null); continue; }
        const n = layout.grouped ? rRuns[i][r] : 1;
        row.push(n ? text(rowLv, it, i) : null);
        if (n) merge(at, i, n, 1);
      }
      for (const c of colItems) {
        const cell = g.cell(it, c);
        const mi = rowLv.includes(MEAS) ? it.t[rowLv.indexOf(MEAS)] : colLv.includes(MEAS) ? c.t[colLv.indexOf(MEAS)] : -1;
        const fmt = mi >= 0 && g.vis[mi] ? model.measures[g.vis[mi].index].fmt : null;
        row.push(typeof cell.s === "number" && isFinite(cell.s) ? { t: "n", v: cell.s, z: (fmt && fmt.xl) || "General" } : cell.f || null);
      }
      aoa.push(row);
    });

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!merges"] = merges;
    const width = i => Math.min(60, Math.max(8, ...aoa.slice(top).map(r => {
      const v = r[i]; return v == null ? 0 : String(typeof v === "object" ? (v.v ?? "") : v).length + 2;
    })));
    ws["!cols"] = Array.from({ length: nRH + colItems.length }, (_, i) => ({ wch: width(i) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, title.replace(/[\\/?*:[\]]/g, " ").slice(0, 31) || "Sheet1");
    const day = now.toISOString().slice(0, 10);
    XLSX.writeFile(wb, `${title.replace(/[\\/:*?"<>|]+/g, "_")}_${day}.xlsx`);
  } catch (err) {
    setNotice("Export failed: " + err.message + ". Try again, or reload the sheet.", true);
    console.error(err);
  } finally {
    btn.disabled = false;
  }
}
$("btnExport").onclick = exportExcel;

function foldSide(folded) {
  $("side").classList.toggle("folded", folded);
  $("btnSide").setAttribute("aria-expanded", String(!folded));
  $("btnSide").title = folded ? "Expand the field list" : "Collapse the field list";
}
$("btnSide").onclick = e => { e.stopPropagation(); foldSide(!$("side").classList.contains("folded")); };
$("side").addEventListener("click", () => { if ($("side").classList.contains("folded")) foldSide(false); });

/* ============================================================
   DRAG AND DROP
   Pointer events rather than HTML5 drag-and-drop: consistent in
   Tableau Desktop's browser, on Server/Cloud, and on touch screens.
   ============================================================ */
let drag = null;
const marker = $("marker");

document.addEventListener("pointerdown", e => {
  if (e.button !== 0 || !layout) return;
  const src = e.target.closest("[data-drag]");
  if (!src) return;
  e.preventDefault();
  const r = src.getBoundingClientRect();
  drag = { src, id: src.dataset.drag, kind: src.dataset.kind, x0: e.clientX, y0: e.clientY,
           dx: e.clientX - r.left, dy: e.clientY - r.top, on: false, target: null };
});

document.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 4) return;
    startDrag();
  }
  drag.ghost.style.transform = `translate(${e.clientX - drag.dx}px, ${e.clientY - drag.dy}px) rotate(-2deg) scale(1.04)`;
  updateTarget(e.clientX, e.clientY);
});

document.addEventListener("pointerup", () => {
  if (!drag) return;
  const d = drag;
  endDrag();
  if (!d.on) {
    if (d.kind === "measure" && layout.measures.includes(d.id)) toggleMeasure(d.id);
    return;
  }
  if (!d.target) return;
  if (d.kind === "measure") d.target.zone === "avail" ? removeMeasure(d.id) : moveMeasure(d.id, d.target.beforeId);
  else moveField(d.id, d.target.zone, d.target.beforeId);
});
document.addEventListener("pointercancel", () => drag && endDrag());

function startDrag() {
  drag.on = true;
  const g = document.createElement("span");
  g.className = "ghost pill" + (drag.kind === "measure" ? " measure" : "");
  g.textContent = drag.src.textContent.trim();
  document.body.appendChild(g);
  drag.ghost = g;
  document.querySelectorAll(`[data-drag="${CSS.escape(drag.id)}"]`).forEach(el => el.classList.add("lifted"));
  document.body.classList.add("dragging");
}

function endDrag() {
  if (drag.ghost) drag.ghost.remove();
  document.querySelectorAll(".lifted").forEach(el => el.classList.remove("lifted"));
  clearOver();
  marker.style.display = "none";
  document.body.classList.remove("dragging", "nodrop");
  drag = null;
}

function clearOver() { document.querySelectorAll(".over").forEach(el => el.classList.remove("over")); }

// Drop zones are measured on every move, so scrolling mid-drag is fine.
function zones(kind) {
  const out = [];
  const shelf = name => {
    const el = document.querySelector(`.shelf[data-zone="${name}"]`);
    if (!el || $("app").classList.contains("collapsed")) return null;
    return { zone: name, dir: "wrap", rect: el.getBoundingClientRect(), hl: [el],
      pillsRect: el.querySelector(".pills").getBoundingClientRect(),
      items: [...el.querySelectorAll(".pill")].map(p => ({ id: p.dataset.id, rect: p.getBoundingClientRect() })) };
  };
  const side = $("side");
  const sideZone = kind !== "meas" && !side.hidden
    ? { zone: "avail", dir: "none", rect: side.getBoundingClientRect(), hl: [side], items: [] } : null;
  if (kind === "measure") {
    // A measure from the field list can also be dropped anywhere on the grid.
    const wrap = $("gridWrap");
    const gridZone = !layout.measures.includes(drag.id) && !$("app").classList.contains("is-empty")
      ? { zone: "values", dir: "none", rect: wrap.getBoundingClientRect(), hl: [], items: [] } : null;
    return [shelf("values"), sideZone, gridZone].filter(Boolean);
  }
  out.push(shelf("cols"), shelf("rows"), sideZone);

  // In the grid: the header area above the row-label row takes columns;
  // the row-header area on the left takes rows.
  const grid = $("grid"), lrow = grid.querySelector("tr.lrow");
  if (grid.tHead && lrow && !$("app").classList.contains("is-empty")) {
    const wr = $("gridWrap").getBoundingClientRect();
    const lr = lrow.getBoundingClientRect();
    const cl = [...grid.querySelectorAll("th.clabel")];
    const rl = [...grid.querySelectorAll("th.rlabel")];
    const rhRight = rl.length ? rl[rl.length - 1].getBoundingClientRect().right : wr.left + 60;
    out.push({ zone: "cols", dir: "v", hl: cl,
      rect: { left: wr.left, right: wr.right, top: wr.top, bottom: lr.top },
      span: { left: wr.left, right: Math.min(wr.right, grid.getBoundingClientRect().right) },
      items: cl.filter(th => th.dataset.id).map(th => ({ id: th.dataset.id, rect: th.getBoundingClientRect() })),
      emptyRect: cl[0] && !cl[0].dataset.id ? cl[0].getBoundingClientRect() : null });
    out.push({ zone: "rows", dir: "h", hl: [...rl, ...grid.querySelectorAll("tbody th.rh")],
      rect: { left: wr.left, right: Math.min(rhRight, wr.right), top: lr.top, bottom: wr.bottom },
      // The marker runs down the whole visible table so it reads as "into the rows".
      fullBottom: Math.min(grid.getBoundingClientRect().bottom, wr.bottom),
      items: rl.filter(th => th.dataset.id).map(th => ({ id: th.dataset.id, rect: th.getBoundingClientRect() })),
      emptyRect: rl[0] && !rl[0].dataset.id ? rl[0].getBoundingClientRect() : null });
  }
  return out.filter(Boolean);
}

const inside = (r, x, y) => x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;

function updateTarget(x, y) {
  clearOver();
  const z = zones(drag.kind).find(z => inside(z.rect, x, y));
  if (!z) {
    drag.target = null; marker.style.display = "none";
    document.body.classList.add("nodrop");
    return;
  }
  document.body.classList.remove("nodrop");
  z.hl.forEach(el => el.classList.add("over"));
  if (z.dir === "none") { drag.target = { zone: z.zone, beforeId: null }; marker.style.display = "none"; return; }

  const items = z.items.filter(it => it.id !== drag.id);
  let i = 0;
  for (; i < items.length; i++) {
    const r = items[i].rect;
    if (z.dir === "v") { if (y < r.top + r.height / 2) break; }
    else if (z.dir === "h") { if (x < r.left + r.width / 2) break; }
    else if (y < r.top || (y <= r.bottom && x < r.left + r.width / 2)) break;
  }
  drag.target = { zone: z.zone, beforeId: items[i] ? items[i].id : null };

  // Marker: a vertical bar between pills, or a horizontal bar between header rows.
  const m = marker.style;
  m.display = "block";
  if (z.dir === "v") {
    const yy = items[i] ? items[i].rect.top : items.length ? items[items.length - 1].rect.bottom : (z.emptyRect || z.rect).bottom;
    Object.assign(m, { left: z.span.left + "px", top: (yy - 1.5) + "px", width: (z.span.right - z.span.left) + "px", height: "3px" });
  } else {
    let xx, ref;
    if (items[i]) { ref = items[i].rect; xx = ref.left - (z.dir === "wrap" ? 3.5 : 1.5); }
    else if (items.length) { ref = items[items.length - 1].rect; xx = ref.right + (z.dir === "wrap" ? 1 : -1.5); }
    else { ref = z.emptyRect || z.pillsRect || z.rect; xx = ref.left + 4; }
    const bottom = z.fullBottom ? Math.max(z.fullBottom, ref.bottom) - 1 : ref.bottom - 1;
    Object.assign(m, { left: xx + "px", top: (ref.top + 1) + "px", width: "3px", height: (bottom - ref.top - 1) + "px" });
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && drag) { endDrag(); return; }
  const p = e.target.closest && e.target.closest(".pill");
  if (!p || !layout) return;
  const id = p.dataset.id, kind = p.dataset.kind;
  const refocus = () => requestAnimationFrame(() => {
    const el = document.querySelector(`.pill[data-id="${CSS.escape(id)}"]`); if (el) el.focus();
  });
  if (kind === "measure") {
    const list = layout.measures, i = list.indexOf(id);
    if (i < 0) {
      if (e.key === "Enter" || e.key === " " || e.key === "ArrowUp") { e.preventDefault(); moveMeasure(id, null); refocus(); }
    }
    else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); removeMeasure(id); refocus(); }
    else if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggleMeasure(id); refocus(); }
    else if (e.key === "ArrowLeft" && i > 0) { e.preventDefault(); moveMeasure(id, list[i - 1]); refocus(); }
    else if (e.key === "ArrowRight" && i < list.length - 1) { e.preventDefault(); moveMeasure(id, list[i + 2] || null); refocus(); }
    return;
  }
  const zone = layout.rows.includes(id) ? "rows" : layout.cols.includes(id) ? "cols" : "avail";
  if (zone === "avail") {
    if (e.key === "ArrowUp") { e.preventDefault(); moveField(id, "cols", null); refocus(); }
    else if (e.key === "ArrowDown" || e.key === "Enter") { e.preventDefault(); moveField(id, "rows", null); refocus(); }
    return;
  }
  if ((e.key === "Delete" || e.key === "Backspace") && id !== MEAS) { e.preventDefault(); moveField(id, "avail"); refocus(); return; }
  const list = layout[zone], i = list.indexOf(id);
  if (e.key === "ArrowLeft" && i > 0) { e.preventDefault(); moveField(id, zone, list[i - 1]); refocus(); }
  else if (e.key === "ArrowRight" && i < list.length - 1) { e.preventDefault(); moveField(id, zone, list[i + 2] || null); refocus(); }
  else if (e.key === "ArrowUp" && zone === "rows") { e.preventDefault(); moveField(id, "cols", null); refocus(); }
  else if (e.key === "ArrowDown" && zone === "cols") { e.preventDefault(); moveField(id, "rows", null); refocus(); }
});

/* ============================================================
   TABLEAU
   ============================================================ */
function matchColumn(name, cols) {
  const n = norm(name), s = norm(stripAgg(name));
  return cols.find(c => c.fieldName === name)
      || cols.find(c => norm(c.fieldName) === n)
      || cols.find(c => norm(stripAgg(c.fieldName)) === s);
}

function cellOf(c) {
  const nv = c.nativeValue;
  const f = c.formattedValue != null ? String(c.formattedValue) : String(c.value ?? "");
  const s = typeof nv === "number" ? nv : nv instanceof Date ? nv.getTime() : f;
  return { f, s };
}

async function loadFromTableau() {
  const [spec] = await Promise.all([worksheet.getVisualSpecificationAsync(), loadParams()]);
  const marks = spec.marksSpecifications[spec.activeMarksSpecificationIndex] || spec.marksSpecifications[0];
  const enc = { rows: [], cols: [], fields: [], values: [] };
  for (const e of (marks && marks.encodings) || []) {
    const ax = ENC_AXIS[e.id];
    if (ax && e.field) enc[ax].push(e.field.name);
  }

  const reader = await worksheet.getSummaryDataReaderAsync(undefined, { ignoreSelection: true, applyWorksheetFormatting: true });
  let table;
  try { table = await reader.getAllPagesAsync(); }
  finally { await reader.releaseAsync(); }

  const cols = table.columns, used = new Set(), missing = [];
  const dims = [], measures = [];
  const claim = name => {
    const c = matchColumn(name, cols);
    if (!c) { missing.push(name); return null; }
    if (used.has(c.index)) return null;
    used.add(c.index); return c;
  };
  enc.rows.forEach(n => { const c = claim(n); if (c) dims.push({ id: n, label: prettyDim(n), col: c.index, axis: "rows" }); });
  enc.cols.forEach(n => { const c = claim(n); if (c) dims.push({ id: n, label: prettyDim(n), col: c.index, axis: "cols" }); });
  // The Fields tile takes both: aggregated names like SUM(x) are measures.
  enc.fields.forEach(n => {
    const c = claim(n);
    if (!c) return;
    if (AGG_RE.test(n.trim())) measures.push({ id: n, label: stripAgg(n), col: c.index, axis: "fields" });
    else dims.push({ id: n, label: prettyDim(n), col: c.index, axis: "fields" });
  });
  enc.values.forEach(n => { const c = claim(n); if (c) measures.push({ id: n, label: stripAgg(n), col: c.index, axis: "values" }); });

  // getAllPagesAsync stops at 400 pages and pads the rest with empty slots.
  const data = table.data.filter(Boolean).map(row => row.map(cellOf));
  diagLines = [
    "WORKSHEET\n  " + worksheet.name,
    "ENCODINGS (raw)\n" + ((marks && marks.encodings) || []).map(e => "  " + e.id + ": " + JSON.stringify(e.field)).join("\n"),
    "ENCODINGS\n  Rows:    " + (enc.rows.join(", ") || "–") + "\n  Columns: " + (enc.cols.join(", ") || "–") +
      "\n  Fields:  " + (enc.fields.join(", ") || "–") + "\n  Values:  " + (enc.values.join(", ") || "–"),
    "SUMMARY DATA COLUMNS (" + data.length + " rows)\n" + cols.map(c => "  [" + c.index + "] " + c.fieldName + "  " + c.dataType).join("\n"),
    missing.length ? "NOT FOUND IN DATA\n  " + missing.join("\n  ") : ""
  ];
  loadWarning = [
    missing.length ? "Some fields could not be read from the sheet: " + missing.join(", ") + ". Open with ?debug=1 for details." : "",
    table.isTotalRowCountLimited ? `Only the first ${data.length.toLocaleString()} rows were loaded. Add filters to the sheet to see everything.` : ""
  ].filter(Boolean).join(" ");
  const m = buildModel({ dims, measures, data });
  applyParams(m);
  diagLines.push("PARAMETER LABELS\n" + ([...m.dims, ...m.measures].filter(f => f.param)
    .map(f => `  ${f.id} <- ${f.param}: ${f.off ? "hidden (none)" : f.label}`).join("\n") || "  –"));
  setModel(m);
}

// Parameters drive field labels; a label-only change shouldn't wait for a data reload.
const watchedParams = new Set();
async function loadParams() {
  try { params = await worksheet.getParametersAsync(); }
  catch (e) { params = []; console.warn("Parameters unavailable", e); }
  for (const p of params) {
    if (watchedParams.has(p.id || p.name)) continue;
    watchedParams.add(p.id || p.name);
    p.addEventListener(tableau.TableauEventType.ParameterChanged, async () => {
      await loadParams();
      if (model) { applyParams(model); render(); }
    });
  }
}

let loading = null, reloadQueued = false;
function refreshFromTableau() {
  if (loading) { reloadQueued = true; return; }
  loading = loadFromTableau()
    .catch(err => { setNotice("Couldn't read the sheet's data: " + err.message, true); console.error(err); })
    .finally(() => { loading = null; if (reloadQueued) { reloadQueued = false; refreshFromTableau(); } });
}

/* ============================================================
   DEMO DATA (used when the page isn't running inside Tableau)
   ============================================================ */
function demoData() {
  let seed = 7;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const fmt = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
  const suppliers = ["1x2Network", "3Oaks", "7rings", "100HP Gaming", "155.io", "7777Gaming", "A Live", "AccaMAX",
    "Alea", "Amusnet", "Animo", "Apparat Gaming", "AvatarUX", "Aviatrix", "Barbara Bang", "Belatra", "Betsoft",
    "BGaming", "Big Daddy", "Booming Games", "Bragg Gaming", "BulBul", "Caleta Gaming", "Endorphina", "Evolution",
    "Evoplay", "Ezugi", "Fantasma"];
  const liveFirst = new Set(["A Live", "Evolution", "Ezugi"]);
  const data = [];
  for (const s of suppliers) {
    const products = liveFirst.has(s) ? ["Live casino", "Table games"] : rnd() < .3 ? ["Slots", "Table games"] : ["Slots"];
    const scale = Math.exp(Math.log(2e3) + rnd() * Math.log(1e6)) * (s === "Evolution" ? 300 : 1);
    for (const p of products) {
      const share = p === "Table games" ? .15 + rnd() * .2 : 1;
      for (const y of [2025, 2026]) {
        const bet = scale * share * (y === 2025 ? .7 + rnd() * .2 : 1);
        const qty = bet * (.3 + rnd() * 2);
        const bonusBet = rnd() < .35 ? bet * rnd() * .01 : 0;
        const bonusWin = bonusBet * (.6 + rnd() * .8);
        const n = v => ({ f: fmt.format(v), s: v });
        data.push([{ f: s, s }, { f: p, s: p }, { f: String(y), s: y }, n(bet), n(qty), n(bonusBet), n(bonusWin)]);
      }
    }
  }
  return {
    dims: [
      { id: "Supplier", label: "Supplier", col: 0, axis: "rows" },
      { id: "Product Type", label: "Product Type", col: 1, axis: "fields" },
      { id: "YEAR(Calendar Date)", label: "Year of Calendar Date", col: 2, axis: "cols" }
    ],
    measures: [
      { id: "SUM(Bet Eur)", label: "Bet Eur", col: 3, axis: "values" },
      { id: "SUM(Bet Qty)", label: "Bet Qty", col: 4, axis: "values" },
      { id: "SUM(Bonus Bet Eur)", label: "Bonus Bet Eur", col: 5, axis: "values" },
      { id: "SUM(Bonus Win Eur)", label: "Bonus Win Eur", col: 6, axis: "fields" }
    ],
    data
  };
}

function startDemo(reason, isError) {
  baseNotice = reason; baseError = !!isError;
  diagLines = ["MODE\n  Demo data"];
  setModel(buildModel(demoData()));
}

function diag() {
  if (!document.body.classList.contains("debug")) return;
  const extra = model ? [
    "MODEL\n  " + model.records.length + " records" + (model.dupes ? ", " + model.dupes + " share a key with another row (combined)" : "") +
      "\n" + model.dims.map(d => "  " + d.id + " [" + d.axis + "]: " + d.members.length + " members").join("\n") +
      "\n" + model.measures.map(m => "  " + m.id + " [" + m.axis + "]: combine " + m.rule).join("\n"),
    "LAYOUT\n  " + JSON.stringify(layout),
    "FORMAT\n  " + JSON.stringify(format)
  ] : [];
  $("diagText").textContent = [...diagLines, ...extra].filter(Boolean).join("\n\n");
}

/* ============================================================
   INIT
   ============================================================ */
// Demo data only ever appears in a local preview (file:// or localhost), never in Tableau.
(async function init() {
  applyFormat(format);
  $("btnFormat").hidden = !LOCAL;
  const hasLib = typeof tableau !== "undefined" && tableau.extensions;
  if (LOCAL && (qs.get("demo") === "1" || !hasLib)) return startDemo("Local preview with demo data.");
  if (!hasLib) {
    return showEmpty("Couldn't load the Tableau library",
      "tableau.extensions.1.latest.min.js is missing next to index.html. Redeploy the extension with that file.");
  }
  // "configure" is the Format Extension button on the Marks card.
  const ready = tableau.extensions.initializeAsync({ configure: openFormat });
  if (LOCAL) {
    try {
      await Promise.race([ready, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), INIT_TIMEOUT_S * 1000))]);
    } catch (e) {
      return startDemo("Local preview with demo data: not running inside Tableau.");
    }
  } else {
    const slow = setTimeout(() => showEmpty("Still connecting to Tableau…",
      "If you opened this page directly, add it to a worksheet instead: Marks card › mark type › Add Extension."), INIT_TIMEOUT_S * 1000);
    try { await ready; }
    catch (e) { return showEmpty("Couldn't connect to Tableau", (e && e.message) || String(e)); }
    finally { clearTimeout(slow); }
    showEmpty("Loading data…", "");
  }
  worksheet = tableau.extensions.worksheetContent && tableau.extensions.worksheetContent.worksheet;
  if (!worksheet) {
    return showEmpty("Add this as a viz extension",
      "This extension draws a worksheet. On a sheet, open the mark type menu on the Marks card and choose Add Extension.");
  }
  try { format = cleanFormat(JSON.parse(tableau.extensions.settings.get("format") || "{}")); }
  catch (e) { format = { ...DEFAULT_FORMAT }; }
  applyFormat(format);
  worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, refreshFromTableau);
  refreshFromTableau();
})();

if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureSticky);
