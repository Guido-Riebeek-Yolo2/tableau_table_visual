<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pivot Grid</title>
<!-- Generic by design: the same file runs unmodified on every worksheet.
     Fields come from the Rows / Columns / Values tiles on the Marks card. -->
<script src="./tableau.extensions.1.latest.min.js"></script>

<style>
  /* Noto Sans (SIL Open Font License, fonts/OFL.txt), hosted with the extension so viewers needn't install it. */
  @font-face { font-family: "Noto Sans"; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url(./fonts/NotoSans-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Noto Sans"; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url(./fonts/NotoSans-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "Noto Sans"; font-style: italic; font-weight: 400 700; font-display: swap;
    src: url(./fonts/NotoSans-italic-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Noto Sans"; font-style: italic; font-weight: 400 700; font-display: swap;
    src: url(./fonts/NotoSans-italic-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }

  :root {
    --ink:         #33393f;
    --ink-2:       #6b737b;
    --line:        #e4e7ea;
    --line-strong: #c4cad0;
    --band:        #f6f7f8;
    --head:        #fafbfb;
    --bg:          #ffffff;
    --dim:         #4a97b8;   /* Tableau's discrete-pill blue */
    --dim-d:       #367a98;
    --meas:        #1aa874;   /* Tableau's measure green */
    --meas-d:      #12825a;
    --drop:        #e8762d;   /* Tableau's orange drop indicator */
    --font: "Benton Sans", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { font: 12px/1.35 var(--font); color: var(--ink); background: var(--bg); }
  #app { height: 100%; display: flex; flex-direction: column; }

  /* ---------- shelves ---------- */
  #shelves { flex: none; border-bottom: 1px solid var(--line-strong); }
  .shelf { display: flex; align-items: flex-start; min-height: 31px; border-bottom: 1px solid var(--line); }
  .shelf:last-child { border-bottom: 0; }
  .shelf.over { background: #fdf6f0; }
  .shelf-label {
    flex: none; width: 92px; padding: 8px 10px 0;
    color: var(--ink-2); display: flex; gap: 6px; align-items: center;
  }
  .shelf-label svg { flex: none; }
  .pills { flex: 1; display: flex; flex-wrap: wrap; gap: 4px; padding: 5px 6px; min-height: 31px; align-items: center; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 10px;
    border-radius: 11px; background: var(--dim); color: #fff; font-weight: 500;
    cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; white-space: nowrap;
  }
  .pill:hover { background: var(--dim-d); }
  .pill.measure { background: var(--meas); }
  .pill.measure:hover { background: var(--meas-d); }
  .pill.measure.off {
    background: transparent; color: var(--meas-d);
    box-shadow: inset 0 0 0 1px var(--meas); text-decoration: line-through;
  }
  .pill.meas-names.empty { opacity: .5; }
  .pill.lifted { opacity: .3; }
  .pill:focus-visible, .tool:focus-visible { outline: 2px solid var(--drop); outline-offset: 2px; }
  .ph { color: var(--ink-2); font-style: italic; padding: 0 4px; }

  /* ---------- toolbar ---------- */
  #toolbar { flex: none; display: flex; align-items: center; gap: 4px; padding: 4px 8px 4px 4px; border-bottom: 1px solid var(--line); background: var(--head); }
  #toolbar .spacer { flex: 1; }
  .tb-title { color: var(--ink-2); padding-right: 6px; }
  #btnShelves svg { transition: transform .15s; }
  #app.collapsed #btnShelves svg { transform: rotate(-90deg); }
  .tool {
    height: 21px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 3px;
    background: var(--bg); color: var(--ink); font: inherit; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .tool:hover { background: var(--band); }
  .tool[aria-pressed="true"], .tool[aria-expanded="true"] { background: #e8f2f7; border-color: var(--dim); color: var(--dim-d); }
  .tool:disabled { opacity: .5; cursor: progress; }
  .decs { display: inline-flex; align-items: center; }
  .decs .tool { padding: 0 5px; font: 600 10px/1 var(--font); letter-spacing: -.2px; }
  .decs .tool:first-child { border-radius: 3px 0 0 3px; }
  .decs .tool:last-of-type { border-radius: 0 3px 3px 0; margin-left: -1px; }
  .decs .tool:disabled { cursor: default; }
  #decCount { padding-left: 4px; color: var(--dim-d); font-weight: 600; }

  .menu {
    position: fixed; z-index: 50; min-width: 210px; padding: 4px 0; background: var(--bg);
    border: 1px solid var(--line-strong); border-radius: 4px; box-shadow: 0 6px 18px rgba(25, 45, 65, .18);
  }
  .menu[hidden] { display: none; }
  .menu h4 { margin: 6px 12px 2px; font-size: 11px; font-weight: 600; color: var(--ink-2); }
  .menu label { display: flex; align-items: center; gap: 7px; padding: 3px 12px; cursor: pointer; white-space: nowrap; }
  .menu label:hover { background: var(--band); }
  .menu label.disabled { opacity: .5; cursor: default; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 0; }
  .menu .hint { padding: 2px 12px; color: var(--ink-2); font-style: italic; }

  #notice { flex: none; padding: 5px 10px; background: #f2f7fa; color: var(--ink-2); border-bottom: 1px solid var(--line); }
  #notice:empty { display: none; }
  #notice.error { background: #fbf0ef; color: #a2403a; }

  /* ---------- field list ---------- */
  #main { flex: 1; display: flex; min-height: 0; }
  #side {
    flex: none; width: 168px; display: flex; flex-direction: column;
    border-right: 1px solid var(--line-strong); background: var(--head); overflow: auto;
  }
  #side[hidden] { display: none; }
  #side.over { background: #fdf6f0; }
  .side-head { display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 5px 4px 2px 10px; color: var(--ink-2); }
  .side-toggle {
    flex: none; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 3px;
    background: transparent; color: var(--ink-2); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .side-toggle:hover { background: var(--line); color: var(--ink); }
  .side-toggle:focus-visible { outline: 2px solid var(--drop); outline-offset: 1px; }
  #side.folded { width: 28px; cursor: pointer; }
  #side.folded .side-head { flex-direction: column-reverse; justify-content: flex-end; padding: 5px 0; gap: 8px; }
  #side.folded .side-title { writing-mode: vertical-rl; }
  #side.folded .side-toggle svg { transform: rotate(180deg); }
  #side.folded #pillsAvail { display: none; }
  #pillsAvail { flex-direction: column; flex-wrap: nowrap; align-items: stretch; padding: 5px 8px 10px; }
  #pillsAvail .pill { overflow: hidden; text-overflow: ellipsis; display: block; line-height: 21px; }
  #pillsAvail .ph { white-space: normal; padding: 2px; }

  /* ---------- grid (colours, fonts and spacing come from the Format panel via --g-*) ---------- */
  #gridWrap { flex: 1; min-width: 0; overflow: auto; position: relative; background: var(--g-bg, var(--bg)); }
  #grid {
    border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums;
    font-family: var(--g-font, var(--font)); font-size: var(--g-size, 12px); color: var(--g-ink, var(--ink));
  }
  #grid th, #grid td {
    padding: var(--g-pad, 3px 9px); white-space: nowrap; background: var(--g-bg, var(--bg));
    border-right: 1px solid var(--g-line, var(--line)); border-bottom: 1px solid var(--g-line, var(--line));
  }
  #grid thead th {
    position: sticky; z-index: 3; text-align: var(--g-head-align, center);
    background: var(--g-head-bg, var(--head)); color: var(--g-head-ink, var(--ink)); font-weight: var(--g-head-w, 600);
    font-style: var(--g-head-i, normal); text-decoration: var(--g-head-u, none);
  }
  #grid thead th.corner {
    z-index: 5; text-align: right; color: var(--g-field-ink, var(--ink));
    font-weight: var(--g-field-w, 400); font-style: var(--g-field-i, normal); text-decoration: var(--g-field-u, none);
  }
  #grid thead th.rlabel { text-align: left; }
  #grid thead tr.lrow th { border-bottom-color: var(--g-line-strong, var(--line-strong)); }
  #grid th.lfill { z-index: 3; }
  #grid tbody th {
    position: sticky; z-index: 2; text-align: var(--g-rh-align, left); vertical-align: top;
    background: var(--g-rh-bg, var(--bg)); color: var(--g-rh-ink, var(--ink)); font-weight: var(--g-rh-w, 400);
    font-style: var(--g-rh-i, normal); text-decoration: var(--g-rh-u, none);
  }
  #grid .last { border-right-color: var(--g-line-strong, var(--line-strong)); }
  #grid td {
    text-align: var(--g-num-align, right);
    font-weight: var(--g-cell-w, 400); font-style: var(--g-cell-i, normal); text-decoration: var(--g-cell-u, none);
  }
  #grid tbody tr.odd > td { background: var(--g-band, var(--band)); }
  #grid tbody tr.gb > * { border-top: 1px solid var(--g-line-strong, var(--line-strong)); }
  #grid .gc { box-shadow: inset 1px 0 0 var(--g-line-strong, var(--line-strong)); }
  #grid th.over { background: #fdf0e6; }
  #grid th.ch.outer { text-align: left; }
  #grid th.ch .stick { position: sticky; left: calc(var(--lsum, 0px) + 9px); }
  #grid thead th.tot, #grid tbody tr.tot > td, #grid tbody tr > td.tot, #grid tbody tr.tot > th.tl {
    background: var(--g-sub-bg, #eef4f7); color: var(--g-sub-ink, var(--ink)); font-weight: var(--g-sub-w, 600);
    font-style: var(--g-sub-i, normal); text-decoration: var(--g-sub-u, none);
  }
  #grid thead th.grand, #grid tbody tr.grand > td, #grid tbody tr > td.grand, #grid tbody tr.grand > th.tl {
    background: var(--g-grand-bg, #e2edf2); color: var(--g-grand-ink, var(--ink)); font-weight: var(--g-grand-w, 600);
    font-style: var(--g-grand-i, normal); text-decoration: var(--g-grand-u, none);
  }
  #grid tbody tr > td.sel { background: #cfe3f3; box-shadow: inset 0 0 0 1px #2e7bb8; }

  .sort {
    display: inline-flex; align-items: center; justify-content: center; vertical-align: -2px;
    min-width: 15px; height: 15px; margin: 0 -4px 0 4px; padding: 0 1px; border: 0; border-radius: 2px;
    background: transparent; color: var(--ink-2); cursor: pointer; opacity: 0; font: 600 9px/1 var(--font);
  }
  #grid th:hover .sort, .sort.on, .sort:focus-visible { opacity: 1; }
  .sort:hover { background: var(--line); color: var(--ink); }
  .sort.on { color: var(--drop); }
  .sort:focus-visible { outline: 2px solid var(--drop); }
  .fold {
    display: inline-flex; align-items: center; justify-content: center; vertical-align: -2px;
    width: 13px; height: 13px; margin: 0 5px 0 -2px; padding: 0; border: 1px solid var(--line-strong); border-radius: 2px;
    background: var(--bg); color: var(--ink-2); cursor: pointer;
  }
  .fold:hover { color: var(--ink); border-color: var(--ink-2); }
  .fold:focus-visible { outline: 2px solid var(--drop); }

  /* ---------- sort menu ---------- */
  #sortMenu { min-width: 380px; max-width: calc(100vw - 8px); }
  .sk-row { display: grid; grid-template-columns: 52px 1fr 104px auto; gap: 5px; align-items: center; padding: 3px 10px; }
  .sk-row .lvl { color: var(--ink-2); }
  .sk-row select, .fp-field input[type=text], .fp-field input[type=number], .fp-field select {
    height: 23px; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 4px;
  }
  .sk-btns { display: flex; gap: 1px; }
  .ib {
    width: 21px; height: 21px; padding: 0; border: 0; border-radius: 3px; background: transparent;
    color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .ib:hover:not(:disabled) { background: var(--line); color: var(--ink); }
  .ib:disabled { opacity: .3; cursor: default; }
  .ib:focus-visible { outline: 2px solid var(--drop); }
  .menu-foot { display: flex; gap: 6px; padding: 6px 10px 4px; }

  /* ---------- format panel ---------- */
  #formatPanel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 60; width: 300px; max-width: 100vw;
    display: flex; flex-direction: column; background: var(--bg);
    border-left: 1px solid var(--line-strong); box-shadow: -6px 0 18px rgba(25, 45, 65, .14);
  }
  #formatPanel[hidden] { display: none; }
  .fp-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .fp-body { flex: 1; overflow: auto; padding: 0 0 10px; }
  .fp-sec { border-bottom: 1px solid var(--line); }
  .fp-sec > summary {
    display: flex; align-items: center; gap: 7px; padding: 9px 12px; cursor: pointer;
    list-style: none; font-weight: 600; user-select: none;
  }
  .fp-sec > summary::-webkit-details-marker { display: none; }
  .fp-sec > summary:hover { background: var(--band); }
  .fp-sec > summary:focus-visible { outline: 2px solid var(--drop); outline-offset: -2px; }
  .fp-sec > summary .chev { flex: none; color: var(--ink-2); transition: transform .15s; }
  .fp-sec[open] > summary .chev { transform: rotate(90deg); }
  .fp-sec[open] > summary { background: var(--head); }
  .fp-sec > summary .desc {
    margin-left: auto; display: inline-flex; align-items: center; gap: 4px; max-width: 55%;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--ink-2); font-weight: 400; font-size: 11px;
  }
  .fp-sec .sw {
    display: inline-flex; align-items: center; justify-content: center; flex: none; width: 15px; height: 15px;
    border: 1px solid var(--line-strong); border-radius: 2px; font: 600 9px/1 var(--font); font-style: normal;
  }
  .fp-sec-body { padding: 4px 0 10px; }
  .fp-sub { margin: 8px 12px 2px; font-size: 11px; font-weight: 600; color: var(--ink-2); }
  .fp-lod { margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--line); }
  .fp-lod-m { display: flex; gap: 4px; align-items: center; min-width: 0; }
  .fp-lod-m select { flex: 1; }
  .fp-ex { display: flex; flex-direction: column; gap: 3px; }
  .fp-ex label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .fp-hint code { font-size: 10.5px; background: var(--band); padding: 0 2px; border-radius: 2px; }
  .fp-check { display: flex; align-items: center; gap: 6px; padding: 3px 12px; cursor: pointer; }
  .fp-io { padding: 2px 12px; }
  .fp-io textarea {
    width: 100%; resize: vertical; font: 11px/1.4 Consolas, "Courier New", monospace; color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: 3px; padding: 4px 6px;
  }
  label.tool { cursor: pointer; }
  .fp-field { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; padding: 3px 12px; }
  .fp-field input[type=color] { width: 44px; height: 23px; padding: 1px; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--bg); cursor: pointer; }
  .fp-field input[type=checkbox] { justify-self: start; }
  .fp-style { display: flex; gap: 4px; }
  .fp-style label { position: relative; }
  .fp-style input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .fp-style span {
    display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 23px;
    border: 1px solid var(--line-strong); border-radius: 3px; background: var(--bg); color: var(--ink); cursor: pointer;
    font: 13px/1 Georgia, "Times New Roman", serif;
  }
  .fp-style input:checked + span { background: #e8f2f7; border-color: var(--dim); color: var(--dim-d); }
  .fp-style input:focus-visible + span { outline: 2px solid var(--drop); outline-offset: 1px; }
  .fp-hint { padding: 2px 12px; color: var(--ink-2); font-size: 11px; }
  .fp-foot { display: flex; gap: 6px; justify-content: flex-end; padding: 8px 10px; border-top: 1px solid var(--line); }
  .fp-foot .left { margin-right: auto; }
  .tool.primary { background: var(--dim); border-color: var(--dim); color: #fff; }
  .tool.primary:hover { background: var(--dim-d); }

  .ftag {
    display: inline-block; padding: 1px 8px; margin: -1px -8px; border-radius: 9px;
    cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .ftag:hover { background: rgba(74,151,184,.14); color: var(--dim-d); }
  .ftag.lifted { opacity: .3; }

  #empty { flex: 1; display: none; align-items: center; justify-content: center; padding: 24px; color: var(--ink-2); text-align: center; }
  #empty p { max-width: 34em; margin: 0; }
  #empty strong { color: var(--ink); display: block; margin-bottom: 4px; font-size: 13px; }
  #app.is-empty #gridWrap { display: none; }
  #app.is-empty #empty { display: flex; }

  #app.collapsed #shelves { display: none; }

  /* ---------- dragging ---------- */
  .ghost {
    position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none;
    box-shadow: 0 8px 18px rgba(25, 45, 65, .28); transform-origin: 20% 50%;
  }
  #marker { position: fixed; display: none; z-index: 999; pointer-events: none; background: var(--drop); border-radius: 2px; }
  #tip {
    position: fixed; z-index: 900; display: none; pointer-events: none; max-width: 360px;
    padding: 7px 10px; background: #fff; color: var(--ink); border: 1px solid var(--line-strong); border-radius: 3px;
    box-shadow: 0 3px 10px rgba(25, 45, 65, .18); font: 12px/1.45 var(--g-font, var(--font));
  }
  #tip .k { color: var(--ink-2); }
  #tip .v { font-weight: 600; }
  #tip .m { margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--line); }
  body.dragging, body.dragging * { cursor: grabbing !important; }
  body.dragging.nodrop, body.dragging.nodrop * { cursor: not-allowed !important; }
  .landed { animation: land .7s ease-out; }
  @keyframes land { from { box-shadow: 0 0 0 3px rgba(232,118,45,.55); } to { box-shadow: 0 0 0 0 rgba(232,118,45,0); } }

  #diag { display: none; flex: none; max-height: 40%; overflow: auto; border-top: 1px solid var(--line); padding: 6px 10px; }
  body.debug #diag { display: block; }
  #diag pre { margin: 4px 0 0; font-size: 11px; white-space: pre-wrap; }

  @media (max-width: 520px) {
    .shelf-label { width: 70px; }
    #side { width: 120px; }
    .tool span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .landed { animation: none; }
  }
</style>
</head>
<body>
<div id="app" class="is-empty">
  <div id="toolbar" role="toolbar" aria-label="Grid tools">
    <button class="side-toggle" id="btnShelves" aria-expanded="true" aria-controls="shelves" title="Hide the layout shelves">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <span class="tb-title">Layout</span>
    <button class="tool" id="btnResetLayout" hidden title="Go back to the layout the author saved"><span>Reset layout</span></button>
    <span class="spacer"></span>
    <button class="tool" id="btnSort" aria-haspopup="true" aria-expanded="false" aria-controls="sortMenu" title="Sort the grid by one or more fields">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3.5 1.5v9M1.5 8.5l2 2 2-2M7 3h4M7 6h3M7 9h2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      <span>Sort grid</span><b id="sortCount"></b>
    </button>
    <button class="tool" id="btnGroup" aria-pressed="true" title="Merge repeated row labels into groups">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 2h3v8h-3M7 2h4M7 5h4M7 8h4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      <span>Group rows</span>
    </button>
    <button class="tool" id="btnExpand" aria-pressed="false" title="Show one row per group, with + to open it">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 1.5h5v5h-5zM4 2.8v2.4M2.8 4h2.4M8.5 4h2M8.5 8h2M5 8h2" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
      <span>Expand rows</span>

      <span>Totals</span>
      <svg width="9" height="9" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
    <span class="decs" role="group" aria-label="Decimals">
      <button class="tool" id="btnDecLess" title="Show fewer decimals" aria-label="Show fewer decimals">.00&rarr;.0</button>

      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 10.5 6 1.5l4 9M3.4 7.3h5.2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>

  <div class="menu" id="sortMenu" hidden></div>
  <aside id="formatPanel" aria-label="Format the grid" hidden>
    <div class="fp-head">Format grid <button class="ib" data-fp="cancel" title="Close without saving" aria-label="Close">
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.4"/></svg></button></div>
    <div class="fp-body" id="fpBody"></div>

      <button class="tool left" data-fp="defaults">Reset to defaults</button>
      <button class="tool" data-fp="cancel">Cancel</button>

    </div>
  </aside>
  <section id="shelves" aria-label="Grid layout">
    <div class="shelf" data-zone="cols">
      <span class="shelf-label">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1v10M6 1v10M10 1v10" stroke="currentColor" stroke-width="1.4"/></svg>
        Columns
      </span>
      <div class="pills" id="pillsCols"></div>
    </div>
    <div class="shelf" data-zone="rows">
      <span class="shelf-label">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 2h10M1 6h10M1 10h10" stroke="currentColor" stroke-width="1.4"/></svg>
        Rows
      </span>
      <div class="pills" id="pillsRows"></div>
    </div>
    <div class="shelf" data-zone="values">
      <span class="shelf-label">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M9.5 1.5h-7l3.5 4.5-3.5 4.5h7" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        Values
      </span>
      <div class="pills" id="pillsValues"></div>

  </section>
  <div id="notice"></div>
  <div id="main">
    <aside id="side" aria-label="Field list" hidden>
      <div class="side-head">
        <span class="side-title">Fields</span>
        <button class="side-toggle" id="btnSide" aria-expanded="true" title="Collapse the field list">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 2.5 4 6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
      </div>
      <div class="pills" id="pillsAvail"></div>
    </aside>
    <div id="gridWrap"><table id="grid"></table></div>
    <div id="empty"><p><strong>Loading data…</strong></p></div>
  </div>
  <div id="diag"><details open><summary>Diagnostics</summary><pre id="diagText">–</pre></details></div>
</div>
<div id="marker"></div>
<div id="tip" role="tooltip"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */

// Encoding ids from the .trex manifest -> grid axis.
// "fields" = the field list: available to the viewer, not on the grid at first.
const ENC_AXIS = { rows: "rows", columns: "cols", values: "values", fields: "fields" };

// How a measure combines when one grid cell covers several rows of data
// (a field is in the field list instead of on the grid). Any other
// aggregation (AVG, COUNTD, MEDIAN, AGG of a calc...) is left blank, never guessed.
const COMBINE_RULE = { SUM: "sum", COUNT: "sum", CNT: "sum", MIN: "min", MAX: "max" };

// Where the Measure Names pill starts out when the author hasn't moved it:
// "cols" or "rows", and its position on that axis (0 = outermost, -1 = innermost).
// Matches the current Sheet 6 layout: Measure Names first on Columns.
const DEFAULT_MEASURES_AXIS = "cols";
const DEFAULT_MEASURES_AT   = 0;
const MAX_DEC = 6;   // the toolbar can add or remove up to this many decimals

// Fields driven by a parameter (e.g. "Grid Level 1" <- "Kp.03 Grid Level 1 (P)") show the
// parameter's current value as their name; a value in PARAM_NONE hides the field entirely.
// A field's parameter is the one whose name contains the field name as whole words.
const PARAM_FIELDS = /grid level|metric selector/i;
const PARAM_NONE   = ["none", "(none)", "- none -", "-", "", "n/a"];

// Grid formatting. The author changes these in the Format panel; they're saved with the workbook.
const DEFAULT_FORMAT = {
  fontFamily: "", fontSize: 12, textColor: "#33393f",
  fieldColor: "#33393f", fieldBold: false, fieldItalic: false, fieldUnderline: false,
  headerBg: "#fafbfb", headerColor: "#33393f", headerBold: true, headerItalic: false, headerUnderline: false, headerAlign: "center",
  rowHeaderBg: "#ffffff", rowHeaderColor: "#33393f", rowHeaderBold: false, rowHeaderItalic: false, rowHeaderUnderline: false, rowHeaderAlign: "left",
  cellBg: "#ffffff", cellBold: false, cellItalic: false, cellUnderline: false,
  banding: true, bandColor: "#f6f7f8", numberAlign: "right", density: "normal",
  subtotalBg: "#eef4f7", subtotalColor: "#33393f", subtotalBold: true, subtotalItalic: false, subtotalUnderline: false,
  grandBg: "#e2edf2", grandColor: "#33393f", grandBold: true, grandItalic: false, grandUnderline: false,
  lineColor: "#e4e7ea", dividerColor: "#c4cad0",
  paramMap: {},  // field id -> parameter name that names it; NO_PARAM = don't rename
  measureFormats: {},  // measure id -> { type, decimals, units, prefix, suffix, thousands, negative }; absent = Tableau's format
  dateFormats: {},     // date dimension id -> DATE_FORMATS key; absent = Tableau's format
  totalRules: {},      // measure id -> { rule, num, den, lods: [{ m, ex: [dim ids] }] }; absent = from the aggregation
  totalsOnly: []       // measure ids that only feed total calculations: never on the grid or in the field list
};
const NO_PARAM = "__none__";
const DATE_FORMATS = {
  "yyyy-MM-dd": "2026-01-31", "dd/MM/yyyy": "31/01/2026", "MM/dd/yyyy": "01/31/2026", "d MMM yyyy": "31 Jan 2026",
  "MMM yyyy": "Jan 2026", "MMMM yyyy": "January 2026", "yyyy-MM": "2026-01", "Qq yyyy": "Q1 2026", "yyyy": "2026",
  "yyyy-MM-dd HH:mm": "2026-01-31 14:05"
};

// Seconds before telling the user we're still waiting for Tableau.
// When opened locally (file:// or localhost) it falls back to demo data instead.
const INIT_TIMEOUT_S = 8;

/* ============================================================ */

const MEAS = "__measures__";
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const LOCAL = location.protocol === "file:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
if (qs.get("debug") === "1") document.body.classList.add("debug");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").replace(/[\s\u00A0]+/g, " ").trim().toLowerCase();
const AGG_RE  = /^(SUM|AVG|MIN|MAX|COUNT|COUNTD|CNT|CNTD|MEDIAN|ATTR|AGG|STDEV|STDEVP|VAR|VARP|PERCENTILE|PCT\d+)\((.*)\)$/i;
const DATE_RE = /^(YEAR|QUARTER|MONTH|WEEK|DAY|WEEKDAY|MY|QY|MDY|HOUR|MINUTE)\((.*)\)$/i;
const DATE_WORD = { YEAR: "Year", QUARTER: "Quarter", MONTH: "Month", WEEK: "Week", DAY: "Day",
  WEEKDAY: "Weekday", MY: "Month", QY: "Quarter", MDY: "Day", HOUR: "Hour", MINUTE: "Minute" };
const stripAgg = n => { const m = AGG_RE.exec(String(n).trim()); return m ? m[2] : n; };
const prettyDim = n => { const m = DATE_RE.exec(String(n).trim()); return m ? `${DATE_WORD[m[1].toUpperCase()]} of ${m[2]}` : n; };
const natural = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
const cmpKey = (a, b) => (typeof a === "number" && typeof b === "number") ? a - b : natural.compare(String(a), String(b));

let model = null;      // the sheet's data, independent of layout
let layout = null;     // { rows, cols, measures, hidden, removed, grouped, expand, open, totals: { sub, grandRows, grandCols, atEnd }, sort }
// layout.open: row groups open with Expand rows on. Levels below `depth` start open; `flip` holds "level:path" exceptions.
let picked = new Map(), anchor = null;   // selected value cells: "row,col" -> td; anchor = [row, col] for Shift+click
let worksheet = null;
let diagLines = [];
let loadWarning = "";
let params = [];       // the sheet's parameters, from worksheet.getParametersAsync()
let format = { ...DEFAULT_FORMAT };

// The API returns every parameter in the workbook and doesn't expose formulas, so a field's
// parameter is found by name. With several candidates the author picks one in the Format panel;
// otherwise the shortest name wins (a global "Grid Level 1 (P)" beats "Kp.03 Grid Level 1 (P)").
function paramCandidates(fieldName) {
  const n = norm(stripAgg(fieldName));
  if (!n || !PARAM_FIELDS.test(n)) return [];
  const re = new RegExp("(^|[^a-z0-9])" + n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "($|[^a-z0-9])");
  return params.filter(p => re.test(norm(p.name))).sort((a, b) => a.name.length - b.name.length);
}
function paramFor(fieldName) {
  const pick = format.paramMap[fieldName];
  if (pick === NO_PARAM) return null;
  const all = paramCandidates(fieldName);
  return (pick && params.find(p => p.name === pick)) || all[0] || null;
}
// Relabels parameter-driven fields and marks those set to "None" as off.
function applyParams(m) {
  m.ambiguous = [];
  for (const f of [...m.dims, ...m.measures]) {
    const p = paramFor(f.id);
    if (!format.paramMap[f.id] && paramCandidates(f.id).length > 1) m.ambiguous.push(f.baseLabel);
    const v = p && p.currentValue ? String(p.currentValue.formattedValue ?? p.currentValue.value ?? "") : null;
    f.param = p ? p.name : null;
    f.paramValue = p && p.currentValue ? String(p.currentValue.value ?? "") : null;
    f.off = v != null && PARAM_NONE.includes(norm(v));
    f.label = v != null && !f.off ? v : f.baseLabel;
  }
}
const isOff = id => {
  if (id === MEAS) return false;
  const f = model.dimPos.has(id) ? model.dims[model.dimPos.get(id)] : model.measById.get(id);
  return !!(f && (f.off || f.helper));
};
// The values of the parameter behind a field, for per-value settings; [] if it has none.
function paramValues(f) {
  const p = f.param && params.find(x => x.name === f.param);
  if (!p) return [];
  const a = p.allowableValues, cur = p.currentValue;
  const out = (a && Array.isArray(a.allowableValues) ? a.allowableValues : [])
    .map(v => ({ v: String(v.value ?? ""), t: String(v.formattedValue ?? v.value ?? "") }));
  if (cur && !out.some(o => o.v === String(cur.value ?? ""))) out.push({ v: String(cur.value ?? ""), t: String(cur.formattedValue ?? cur.value ?? "") });
  return out.filter(o => o.v);
}
// Settings for one value of a parameter-driven measure are stored under "<measure id> @ <value>".
const VAL_SEP = " @ ";
const valKey = (id, v) => v ? id + VAL_SEP + v : id;
const hasValueKeys = (map, id) => Object.keys(map).some(k => k.startsWith(id + VAL_SEP));
const settingFor = (map, m) => (m.paramValue && map[valKey(m.id, m.paramValue)]) || map[m.id];

const ruleOf = id => { const m = AGG_RE.exec(String(id).trim()); return (m && COMBINE_RULE[m[1].toUpperCase()]) || "none"; };

// Formats combined values the way Tableau formats this measure, learned from
// its own formatted cells: prefix/suffix, separators, decimals, %, K/M/B units.
function inferFormat(cells) {
  const plain = v => String(Math.round(v * 1e6) / 1e6);
  plain.xl = "General";
  plain.withDec = () => plain;
  const nums = cells.filter(c => c && typeof c.s === "number" && isFinite(c.s) && c.s !== 0 && /\d/.test(c.f));
  if (!nums.length) return plain;
  const split = c => /^(.*?)(\d(?:[\d.,'\s\u00a0\u202f]*\d)?)(\D*)$/.exec(c.f);
  const biggest = list => list.reduce((a, c) => Math.abs(c.s) > Math.abs(a.s) ? c : a);
  const pos = nums.filter(c => c.s > 0), neg = nums.filter(c => c.s < 0);
  const ex = biggest(pos.length ? pos : nums);
  const p = split(ex);
  if (!p) return plain;
  const [, pre, num, suf] = p;
  let posPre = pre, posSuf = suf, negPre, negSuf;
  if (ex.s < 0) {
    posPre = pre.replace(/[-\u2212(]/, ""); posSuf = suf.replace(")", "");
    negPre = pre; negSuf = suf;
  } else {
    const q = neg.length && split(biggest(neg));
    negPre = q ? q[1] : "-" + pre; negSuf = q ? q[3] : suf;
  }
  const last = num.replace(/\d/g, "").slice(-1);
  for (const scale of [1, 100, 1e-3, 1e-6, 1e-9, 1e-12]) {
    for (const dec of last ? [last, ""] : [""]) {
      const at = dec ? num.lastIndexOf(dec) : -1;
      const ip = at < 0 ? num : num.slice(0, at), fp = at < 0 ? "" : num.slice(at + 1);
      if (/\D/.test(fp)) continue;
      const val = Number(ip.replace(/\D/g, "") + "." + (fp || "0"));
      if (Math.abs(val - Math.abs(ex.s) * scale) > 0.5 * 10 ** -fp.length + 1e-9 * val) continue;
      const dp = dec || (last === "." ? "," : ".");
      const group = ip.replace(/\d/g, "")[0] || (val >= 1000 ? "" : dp === "," ? "." : ",");
      const make = d => {
        const fn = v => {
          const r = (Math.abs(v) * scale).toFixed(d);
          const [i, f] = r.split(".");
          const n = (group ? i.replace(/\B(?=(\d{3})+(?!\d))/g, group) : i) + (f ? dp + f : "");
          return v < 0 && /[1-9]/.test(r) ? negPre + n + negSuf : posPre + n + posSuf;
        };
        // Same format as an Excel number format string (Excel always uses "," and "." in the code).
        const lit = s => s ? '"' + s.replace(/"/g, "") + '"' : "";
        let body = (group ? "#,##0" : "0") + (d ? "." + "0".repeat(d) : ""), suf = posSuf;
        if (scale === 100) { body += "%"; suf = suf.replace("%", ""); }
        else if (scale < 1) body += ",".repeat(Math.round(-Math.log10(scale) / 3));
        const pos = lit(posPre) + body + lit(suf);
        fn.xl = pos + ";" + (negPre.includes("(") ? "(" + pos + ")" : "-" + pos);
        fn.withDec = k => make(Math.max(0, fp.length + k));
        return fn;
      };
      return make(fp.length);
    }
  }
  return plain;
}

/* ============================================================
   MODEL
   dims:     [{ id, label, col, axis }]  axis = author's tile: "rows" | "cols" | "fields"
   measures: [{ id, label, col, axis }]  axis = "values" | "fields"
   data:     rows of cells { f: formatted text, s: sort key }
   ============================================================ */
function buildModel({ dims, measures, data }) {
  const ds = dims.map(d => ({ ...d, baseLabel: d.label, members: [], index: new Map() }));
  ds.forEach(d => {
    const seen = new Map();
    for (const row of data) { const c = row[d.col]; if (!seen.has(c.f)) seen.set(c.f, c.s); }
    const entries = [...seen.entries()].sort((a, b) => cmpKey(a[1], b[1]));
    d.members = entries.map(e => e[0]);
    d.members.forEach((m, k) => d.index.set(m, k));
    // True dates (not date parts like YEAR) can be reformatted; s holds the UTC time in ms.
    d.isDate = data.some(row => row[d.col].dt);
    if (d.isDate) d.times = entries.map(e => typeof e[1] === "number" ? e[1] : null);
  });
  const keys = new Set();
  const records = data.map(row => {
    const k = ds.map(d => d.index.get(row[d.col].f));
    keys.add(k.join(","));
    return { k, m: measures.map(m => row[m.col]) };
  });
  const ms = measures.map(m => ({
    ...m, baseLabel: m.label, rule: ruleOf(m.id), autoRule: ruleOf(m.id), fmt: inferFormat(data.map(r => r[m.col])),
    sample: (data.find(r => typeof r[m.col].s === "number" && r[m.col].s) || [])[m.col]?.s
  }));
  return {
    dims: ds, measures: ms, records, dupes: records.length - keys.size,
    dimPos: new Map(ds.map((d, i) => [d.id, i])),
    measById: new Map(ms.map((m, i) => [m.id, Object.assign(m, { index: i })]))
  };
}

/* ============================================================
   LAYOUT
   ============================================================ */
function defaultLayout() {
  const rows = model.dims.filter(d => d.axis === "rows").map(d => d.id);
  const cols = model.dims.filter(d => d.axis === "cols").map(d => d.id);
  if (model.measures.length) {
    const list = DEFAULT_MEASURES_AXIS === "rows" ? rows : cols;
    const at = DEFAULT_MEASURES_AT < 0 ? list.length : Math.min(DEFAULT_MEASURES_AT, list.length);
    list.splice(at, 0, MEAS);
  }
  return {
    rows, cols, measures: model.measures.filter(m => m.axis !== "fields").map(m => m.id), hidden: [], removed: [],
    grouped: true, expand: false, open: { depth: 0, flip: [] }, dec: 0,
    totals: { sub: [], grandRows: false, grandCols: false, atEnd: false },  // sub: field ids with subtotals, on whichever axis
    sort: []     // ordered keys: { type: "dim", id, dir } | { type: "val", sig: column signature, dir }
  };
}

// Keeps the user's arrangement when the data refreshes; fields the author
// added or moved to another tile since go to their starting place, removed fields drop out.
// `removed` holds dims and measures the viewer moved to the field list.
function reconcile(old, prev) {
  const def = defaultLayout();
  if (!old) return def;
  const all = [...model.dims, ...model.measures];
  const prevAxis = new Map(prev ? [...prev.dims, ...prev.measures].map(f => [f.id, f.axis]) : []);
  const authorMoved = new Set(all.filter(f => prevAxis.has(f.id) && prevAxis.get(f.id) !== f.axis).map(f => f.id));
  const dimIds = new Set(model.dims.map(d => d.id));
  const keepDim = id => id === MEAS ? model.measures.length > 0 : dimIds.has(id) && !authorMoved.has(id);
  const keepMeas = id => model.measById.has(id) && !authorMoved.has(id);
  const rows = old.rows.filter(keepDim), cols = old.cols.filter(keepDim);
  const measures = old.measures.filter(keepMeas);
  const removed = old.removed.filter(id => keepDim(id) || keepMeas(id));
  const placed = new Set([...rows, ...cols, ...measures, ...removed]);
  def.rows.forEach(id => { if (!placed.has(id)) rows.push(id); });
  def.cols.forEach(id => { if (!placed.has(id)) cols.push(id); });
  def.measures.forEach(id => { if (!placed.has(id)) measures.push(id); });
  const hidden = old.hidden.filter(id => measures.includes(id));
  const totals = { ...def.totals, ...old.totals, sub: old.totals.sub.filter(id => id === MEAS || dimIds.has(id)) };
  const sort = (Array.isArray(old.sort) ? old.sort : []).filter(k => k.type !== "dim" || dimIds.has(k.id));
  return { rows, cols, measures, hidden, removed, grouped: old.grouped, expand: !!old.expand, open: old.open || def.open, dec: old.dec || 0, totals, sort };
}

const visibleMeasures = () => layout.measures.filter(id => !layout.hidden.includes(id) && !isOff(id)).map(id => model.measById.get(id));
const activeLevels = (list, vis) => list.filter(id => id === MEAS ? vis.length > 0 : !isOff(id));
const levelName = id => id === MEAS ? "Measure Names" : model.dims[model.dimPos.get(id)].label;

/* ============================================================
   PIVOT
   One tuple per header path. Tuples hold member indices, aligned with
   the axis levels; the Measure Names level holds a visible-measure index.
   Only combinations that exist in the data are produced, as in Tableau.
   ============================================================ */
function axisTuples(levels, vis) {
  if (!levels.length) return [[]];
  const pos = levels.map(id => id === MEAS ? -1 : model.dimPos.get(id));
  const dimAt = pos.map((p, i) => p >= 0 ? i : -1).filter(i => i >= 0);
  const combos = new Map();
  for (const r of model.records) {
    const t = dimAt.map(i => r.k[pos[i]]);
    const key = t.join(",");
    if (!combos.has(key)) combos.set(key, t);
  }
  const mAt = levels.indexOf(MEAS);
  const out = [];
  for (const t of combos.values()) {
    if (mAt < 0) { out.push(t); continue; }
    for (let mi = 0; mi < vis.length; mi++) { const u = t.slice(); u.splice(mAt, 0, mi); out.push(u); }
  }
  out.sort((a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; });
  return out;
}

// Values at any level of detail. `fixed` = [[dimPos, member], ...] sorted by dimPos;
// dims not listed are aggregated over, which is how totals are computed.
// A value covering one row of data is Tableau's own cell; several rows are combined.
const EMPTY = { f: "", s: null };
let views = new Map(), blanked = new Set();
function cellAt(fixed, mIdx) {
  const mask = fixed.map(f => f[0]).join(",");
  let v = views.get(mask);
  if (!v) {
    const pos = fixed.map(f => f[0]);
    const groups = new Map();
    for (const r of model.records) {
      const key = pos.map(p => r.k[p]).join(",");
      const g = groups.get(key);
      if (g) g.push(r); else groups.set(key, [r]);
    }
    v = new Map();
    for (const [key, g] of groups) v.set(key, g.length === 1 ? { cells: g[0].m } : { recs: g, cells: [] });
    views.set(mask, v);
  }
  const e = v.get(fixed.map(f => f[1]).join(","));
  if (!e) return EMPTY;
  if (e.recs && !e.cells[mIdx]) e.cells[mIdx] = combine(e.recs, mIdx, fixed);
  return e.cells[mIdx];
}
const nums = (g, i) => g.map(r => r.m[i].s).filter(v => typeof v === "number" && isFinite(v));
// Combines several rows of one measure using its total rule (Format › Total calculations).
function combine(g, i, fixed) {
  const m = model.measures[i];
  const out = v => v == null || !isFinite(v) ? EMPTY : { f: m.fmt(v), s: v };
  if (m.rule === "ratio") {
    const den = nums(g, m.ratio[1]).reduce((a, b) => a + b, 0);
    return den ? out(nums(g, m.ratio[0]).reduce((a, b) => a + b, 0) / den) : EMPTY;
  }
  if (m.rule === "countd") {
    // Distinct members of the counted field among rows where the measure is non-zero.
    const seen = new Set();
    for (const r of g) { const c = r.m[i]; if (typeof c.s === "number" && c.s !== 0) seen.add(r.k[m.countdPos]); }
    return out(seen.size);
  }
  if (m.rule === "lod") {
    // Use the LOD measure that excludes exactly the dims being totalled here; its value must be
    // the same on every row of the group, otherwise it isn't this total and the cell stays blank.
    const fixedPos = new Set(fixed.map(f => f[0]));
    const wild = model.dims.map((d, p) => p).filter(p => !fixedPos.has(p) && model.dims[p].members.length > 1);
    const lod = m.lods.find(l => l.ex.length === wild.length && wild.every(p => l.ex.includes(p)));
    const vals = lod ? nums(g, lod.idx) : [];
    if (!vals.length || vals.some(v => Math.abs(v - vals[0]) > 1e-9 * Math.max(1, Math.abs(v)))) { blanked.add(m.id); return EMPTY; }
    return out(vals[0]);
  }
  if (m.rule === "none") { blanked.add(m.id); return EMPTY; }
  const vals = nums(g, i);
  if (!vals.length) return EMPTY;
  return out(vals.reduce(m.rule === "sum" ? (a, b) => a + b : m.rule === "min" ? (a, b) => Math.min(a, b) : (a, b) => Math.max(a, b)));
}

const nullsLast = (a, b, dir) => a == null ? (b == null ? 0 : 1) : b == null ? -1 : dir === "asc" ? cmpKey(a, b) : cmpKey(b, a);
const numOrNull = c => typeof c.s === "number" && isFinite(c.s) ? c.s : null;

/* One item per header path on an axis, in display order, totals included.
   t:   member index per level; -1 = all members (a total); the Measure Names level holds a visible-measure index.
   tot: null for data paths, else the level being totalled (-1 = grand total).
   opt: { sub: Set of levels with subtotals, grand, atEnd, order(L, prefix, members), flatCmp, fold: { can(L), open(L, prefix) } }
   A closed group is one row per measure at that level (fold: L), like a subtotal without the Total label. */
function axisItems(levels, vis, opt) {
  const tuples = axisTuples(levels, vis);
  const measAt = levels.indexOf(MEAS);
  const dimAfter = L => levels.slice(L + 1).some(id => id !== MEAS);
  const totalsFor = (L, prefix) => {
    if (!dimAfter(L)) return [];
    const ms = measAt > L ? vis.map((_, i) => i) : [null];
    return ms.map(m => ({ t: levels.map((id, i) => i <= L ? prefix[i] : id === MEAS ? m : -1), tot: L }));
  };
  let items;
  if (opt.flatCmp) {
    items = tuples.slice().sort(opt.flatCmp).map(t => ({ t, tot: null }));
  } else {
    const walk = (list, L, prefix) => {
      if (L === levels.length) return [{ t: prefix, tot: null }];
      const groups = new Map();
      for (const t of list) { const g = groups.get(t[L]); if (g) g.push(t); else groups.set(t[L], [t]); }
      const out = [];
      for (const m of opt.order(L, prefix, [...groups.keys()])) {
        const p = [...prefix, m];
        if (opt.fold && opt.fold.can(L) && !opt.fold.open(L, p)) {
          out.push(...totalsFor(L, p).map(it => ({ ...it, tot: null, fold: L })));
          continue;
        }
        const inner = walk(groups.get(m), L + 1, p);
        const tots = opt.sub.has(L) ? totalsFor(L, p) : [];
        out.push(...(opt.atEnd ? inner.concat(tots) : tots.concat(inner)));
      }
      return out;
    };
    items = levels.length ? walk(tuples, 0, []) : [{ t: [], tot: null }];
  }
  if (opt.grand && levels.length) {
    const g = totalsFor(-1, []);
    items = opt.atEnd ? items.concat(g) : g.concat(items);
  }
  return items;
}

/* Everything the screen and the export need, from the current layout. */
function buildGrid() {
  views = new Map(); blanked = new Set();
  const vis = visibleMeasures();
  const rowLv = activeLevels(layout.rows, vis), colLv = activeLevels(layout.cols, vis);
  const rMeasAt = rowLv.indexOf(MEAS), cMeasAt = colLv.indexOf(MEAS);
  const label = (id, idx) => {
    if (id === MEAS) return vis[idx].label;
    const d = model.dims[model.dimPos.get(id)];
    return d.labels ? d.labels[idx] : d.members[idx];
  };
  const fixedOf = (lv, t) => lv.flatMap((id, i) => id !== MEAS && t[i] >= 0 ? [[model.dimPos.get(id), t[i]]] : []);
  const subOf = lv => new Set(lv.map((id, L) => layout.totals.sub.includes(id) ? L : -1).filter(L => L >= 0));
  const keys = layout.sort;   // ordered sort keys; earlier keys win, later ones break ties
  const dimOrder = lv => (L, prefix, members) => {
    const k = keys.find(k => k.type === "dim" && k.id === lv[L]);
    return k && k.dir === "desc" ? members.slice().reverse() : members;
  };

  const colItems = axisItems(colLv, vis, {
    sub: subOf(colLv), grand: layout.totals.grandCols, atEnd: layout.totals.atEnd, order: dimOrder(colLv)
  });
  colItems.forEach(c => { c.fx = fixedOf(colLv, c.t); });
  const colSig = c => colLv.map((id, i) => id + "=" + (c.t[i] < 0 ? "*" : id === MEAS ? vis[c.t[i]].id : label(id, c.t[i])))
    .sort().join("|") + "|" + (c.tot == null ? "" : c.tot < 0 ? "grand" : colLv[c.tot]);
  colItems.forEach(c => { c.sig = colSig(c); });
  const colBySig = new Map(colItems.map(c => [c.sig, c]));

  const value = (rFixed, rt, c) => {
    const mi = rMeasAt >= 0 ? rt[rMeasAt] : cMeasAt >= 0 ? c.t[cMeasAt] : -1;
    if (mi == null || mi < 0 || !vis[mi]) return EMPTY;
    return cellAt([...rFixed, ...c.fx].sort((a, b) => a[0] - b[0]), vis[mi].index);
  };
  const chain = cmps => (a, b) => { for (const c of cmps) { const d = c(a, b); if (d) return d; } return 0; };

  // Grouped: each level is sorted within its parent; value keys use the group's subtotal.
  const rowOrder = (L, prefix, members) => {
    const cmps = [];
    for (const k of keys) {
      if (k.type === "dim") {
        if (k.id === rowLv[L]) cmps.push((a, b) => k.dir === "asc" ? a - b : b - a);
        continue;
      }
      const col = colBySig.get(k.sig);
      if (!col || rowLv[L] === MEAS) continue;
      const mVis = cMeasAt >= 0 ? col.t[cMeasAt] : rMeasAt >= 0 && rMeasAt < L ? prefix[rMeasAt] : 0;
      const meas = vis[mVis];
      if (!meas) continue;
      // A group of a measure that can't be added up has no subtotal: don't sort the groups by it.
      if (rowLv.slice(L + 1).some(id => id !== MEAS) && ["none", "lod"].includes(model.measures[meas.index].rule)) continue;
      const t = rowLv.map((id, i) => i < L ? prefix[i] : -1);
      const vals = new Map(members.map(m => {
        t[L] = m;
        const rt = rMeasAt >= 0 ? t.map((v, i) => i === rMeasAt ? mVis : v) : t;
        return [m, numOrNull(value(fixedOf(rowLv, t), rt, col))];
      }));
      cmps.push((a, b) => nullsLast(vals.get(a), vals.get(b), k.dir));
    }
    if (!cmps.length) return members;
    cmps.push((a, b) => a - b);
    return members.slice().sort(chain(cmps));
  };
  // Ungrouped: all rows as one flat list, compared key by key.
  let flatCmp = null;
  if (!layout.grouped && rowLv.length) {
    const cmps = [];
    for (const k of keys) {
      if (k.type === "dim") {
        const L = rowLv.indexOf(k.id);
        if (L >= 0) cmps.push((a, b) => k.dir === "asc" ? a[L] - b[L] : b[L] - a[L]);
        continue;
      }
      const col = colBySig.get(k.sig);
      if (!col) continue;
      const cache = new Map();
      const v = t => {
        const key = t.join(",");
        if (!cache.has(key)) cache.set(key, numOrNull(value(fixedOf(rowLv, t), t, col)));
        return cache.get(key);
      };
      cmps.push((a, b) => nullsLast(v(a), v(b), k.dir));
    }
    if (cmps.length) flatCmp = chain(cmps);
  }
  const foldOn = layout.expand && layout.grouped && rowLv.filter(id => id !== MEAS).length > 1;
  const canFold = L => foldOn && rowLv[L] !== MEAS && rowLv.slice(L + 1).some(id => id !== MEAS);
  const foldKey = (L, t) => L + ":" + rowLv.slice(0, L + 1)
    .map((id, i) => id + "=" + (id === MEAS ? vis[t[i]].id : model.dims[model.dimPos.get(id)].members[t[i]])).join("|");
  const anyOpen = [], flip = new Set(layout.open.flip);
  const isOpen = (L, t) => {
    const o = (L < layout.open.depth) !== flip.has(foldKey(L, t));
    if (o) anyOpen[L] = true;
    return o;
  };
  const rowSub = subOf(rowLv);
  const rowItems = axisItems(rowLv, vis, {
    sub: rowSub, grand: layout.totals.grandRows, atEnd: layout.totals.atEnd, order: rowOrder, flatCmp,
    fold: foldOn ? { can: canFold, open: isOpen } : null
  });
  rowItems.forEach(r => { r.fx = fixedOf(rowLv, r.t); });

  // Header text for level i of an item; the first "all members" level of a total carries its label.
  const text = (lv, it, i) => {
    if (it.t[i] >= 0) return label(lv[i], it.t[i]);
    if (it.fold != null) return "";
    return it.t.findIndex(v => v < 0) === i ? (it.tot === -1 ? "Grand total" : "Total") : "";
  };
  // Per visible measure: its custom format, shifted by the toolbar's extra/fewer decimals.
  const fmts = vis.map(m => {
    const f = m.custom || (layout.dec ? m.fmt : null);
    return f && layout.dec ? f.withDec(layout.dec) : f;
  });
  return {
    vis, rowLv, colLv, rowItems, colItems, text,
    cell: (r, c) => {
      const v = value(r.fx, r.t, c);
      const mi = rMeasAt >= 0 ? r.t[rMeasAt] : cMeasAt >= 0 ? c.t[cMeasAt] : -1;
      const f = fmts[mi];
      return f && typeof v.s === "number" && isFinite(v.s) ? { f: f(v.s), s: v.s } : v;
    },
    fmtOf: mi => fmts[mi] || (vis[mi] && vis[mi].fmt),
    subHidden: !!flatCmp && rowSub.size > 0,
    fold: { can: canFold, key: foldKey, anyOpen },
    foldOff: layout.expand && !layout.grouped && rowLv.filter(id => id !== MEAS).length > 1
  };
}

// Level at which each tuple first differs from the one before it.
const firstDiff = T => T.map((t, i) => {
  if (i === 0) return 0;
  const p = T[i - 1];
  for (let j = 0; j < t.length; j++) if (t[j] !== p[j]) return j;
  return t.length;
});
// Span length at each run start for a given level, 0 elsewhere.
const runLens = (fd, lvl) => {
  const out = new Array(fd.length).fill(0);
  let start = 0;
  for (let i = 1; i <= fd.length; i++) if (i === fd.length || fd[i] <= lvl) { out[start] = i - start; start = i; }
  return out;
};

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  hideTip();
  renderShelves();
  const app = $("app");
  if (!model || !model.dims.length && !model.measures.length) {
    return showEmpty("Add fields to start",
      "On the Marks card, drag dimensions onto Rows or Columns and measures onto Values.");
  }
  if (!model.records.length) {
    return showEmpty("No data to show", "The filters on this sheet return no rows. Change a filter to see values here.");
  }
  app.classList.remove("is-empty");

  const g = buildGrid();
  lastGrid = g;
  const { vis, rowLv, colLv, rowItems, colItems, text } = g;
  const nRH = Math.max(rowLv.length, 1), nCH = Math.max(colLv.length, 1);
  const keys = layout.sort;
  // Header buttons show the key's direction and, with several keys, its position in the sort order.
  const keyState = target => {
    const i = keys.findIndex(k => sameKey(k, target));
    return i < 0 ? { dir: "", n: "" } : { dir: keys[i].dir, n: keys.length > 1 ? i + 1 : "" };
  };
  const dimSortBtn = id => {
    if (id === MEAS) return "";
    const { dir, n } = keyState({ type: "dim", id });
    return sortBtn(`data-sortdim="${esc(id)}"`, dir, dir === "asc" ? "Sort Z to A" : dir === "desc" ? "Remove this sort" : "Sort A to Z", n);
  };
  const fieldTag = id =>
    `<span class="ftag" data-drag="${esc(id)}" data-kind="${id === MEAS ? "meas" : "dim"}" title="Drag to move">${esc(levelName(id))}</span>${dimSortBtn(id)}`;
  const ph = `<span class="ph">Drop a field here</span>`;

  const cFD = firstDiff(colItems.map(c => c.t)), rFD = firstDiff(rowItems.map(r => r.t));
  const gbCol = colItems.map((_, c) => c > 0 && cFD[c] < nCH - 1);
  const canSort = rowItems.length > 1 && vis.length > 0;

  // ---- column headers: one row per column level, then the row-label row
  let h = "<thead>";
  for (let L = 0; L < nCH; L++) {
    const id = colLv[L];
    h += `<tr class="hr">` +
      `<th class="corner clabel last" colspan="${nRH}" style="top:var(--t${L},0);left:0" data-id="${id ? esc(id) : ""}">${id ? fieldTag(id) : ph}</th>`;
    const runs = runLens(cFD, L);
    for (let c = 0; c < colItems.length; c++) {
      if (!runs[c]) continue;
      const it = colItems[c];
      // Outer headers that span several columns keep their label in view while scrolling sideways.
      const outer = L < nCH - 1 && runs[c] > 1;
      const txt = id ? esc(text(colLv, it, L)) : "";
      let btn = "";
      if (L === nCH - 1 && canSort) {
        const { dir, n } = keyState({ type: "val", sig: it.sig });
        btn = sortBtn(`data-sig="${esc(it.sig)}"`, dir,
          dir === "desc" ? "Sort smallest to largest" : dir === "asc" ? "Remove this sort" : "Sort rows largest to smallest", n);
      }
      const tc = it.tot == null ? "" : it.tot === -1 ? " grand" : " tot";
      h += `<th class="ch${gbCol[c] ? " gc" : ""}${outer ? " outer" : ""}${tc}" colspan="${runs[c]}" style="top:var(--t${L},0)">${outer ? `<span class="stick">${txt}</span>` : txt}${btn}</th>`;
    }
    h += "</tr>";
  }
  h += `<tr class="hr lrow">`;
  for (let i = 0; i < nRH; i++) {
    const id = rowLv[i];
    const all = g.fold.can(i) ? foldBtn(`data-foldall="${i}"`, !!g.fold.anyOpen[i],
      g.fold.anyOpen[i] ? `Collapse all ${levelName(id)}` : `Expand all ${levelName(id)}`) : "";
    h += `<th class="corner rlabel${i === nRH - 1 ? " last" : ""}" style="top:var(--t${nCH},0);left:var(--l${i},0)" data-id="${id ? esc(id) : ""}">${all}${id ? fieldTag(id) : ph}</th>`;
  }
  h += `<th class="lfill" colspan="${colItems.length}" style="top:var(--t${nCH},0)"></th></tr></thead>`;

  // ---- body: grouped rows merge repeated labels; ungrouped rows repeat them
  const grouped = layout.grouped;
  const rRuns = rowLv.map((_, i) => runLens(rFD, i));
  let b = "<tbody>";
  for (let r = 0; r < rowItems.length; r++) {
    const it = rowItems[r];
    const cls = [r % 2 ? "odd" : "", grouped && r > 0 && rFD[r] < nRH - 1 ? "gb" : "",
      it.tot != null ? "tot" : "", it.tot === -1 ? "grand" : ""].filter(Boolean).join(" ");
    b += `<tr class="${cls}">`;
    if (!rowLv.length) b += `<th class="rh last" style="left:0"></th>`;
    for (let i = 0; i < rowLv.length; i++) {
      const n = grouped ? rRuns[i][r] : 1;
      if (!n) continue;
      const txt = esc(text(rowLv, it, i));
      const tog = g.fold.can(i) && it.t[i] >= 0
        ? foldBtn(`data-fold="${esc(g.fold.key(i, it.t))}"`, it.fold !== i, `${it.fold === i ? "Expand" : "Collapse"} ${text(rowLv, it, i)}`) : "";
      b += `<th class="rh${i === nRH - 1 ? " last" : ""}${it.t[i] < 0 ? " tl" : ""}"${n > 1 ? ` rowspan="${n}"` : ""} style="left:var(--l${i},0)">${tog}${txt}</th>`;
    }
    for (let c = 0; c < colItems.length; c++) {
      const ct = colItems[c];
      const cls2 = (gbCol[c] ? "gc " : "") + (ct.tot == null ? "" : ct.tot === -1 ? "grand" : "tot");
      b += `<td${cls2 ? ` class="${cls2.trim()}"` : ""}>${esc(g.cell(it, ct).f)}</td>`;
    }
    b += "</tr>";
  }
  b += "</tbody>";

  const grid = $("grid");
  grid.innerHTML = h + b;
  picked = new Map(); anchor = null; updateCopyButton();
  measureSticky();

  const blank = vis.filter(m => blanked.has(m.id)).map(m => m.label);
  const msg = [
    !model.measures.length ? ""
      : !layout.measures.length ? "Drag a measure from the field list onto Values to show numbers."
      : !vis.length ? "All measures are hidden. Click a measure on the Values shelf to show it."
      : blank.length ? `${blank.join(", ")} can't be added up, so cells and totals that combine several rows of data are blank.`
      : "",
    g.subHidden ? "Subtotals are hidden while rows are sorted without grouping. Turn on Group rows to see them." : "",
    g.foldOff ? "Expand rows works on grouped rows. Turn on Group rows to use it." : "",
    model.ambiguous && model.ambiguous.length
      ? `${model.ambiguous.join(", ")} match${model.ambiguous.length > 1 ? "" : "es"} several parameters. Choose the right one under Format › Parameter names.` : ""
  ].filter(Boolean).join(" ");
  setNotice(loadWarning || msg, !!loadWarning);
  if (!$("totalsMenu").hidden) renderTotalsMenu();
  if (!$("sortMenu").hidden) renderSortMenu();
  diag();
}

const SORT_ICON = {
  "":   `<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 1.5v9M1.8 8.3 4 10.5l2.2-2.2M8 10.5v-9M5.8 3.7 8 1.5l2.2 2.2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>`,
  desc: `<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M2.5 7 6 10.5 9.5 7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`,
  asc:  `<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10.5v-9M2.5 5 6 1.5 9.5 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`
};
const foldBtn = (attrs, open, title) =>
  `<button class="fold" ${attrs} aria-expanded="${open}" title="${esc(title)}" aria-label="${esc(title)}">` +
  `<svg width="7" height="7" viewBox="0 0 8 8" aria-hidden="true"><path d="${open ? "M1 4h6" : "M1 4h6M4 1v6"}" stroke="currentColor" stroke-width="1.4"/></svg></button>`;
const sortBtn = (attrs, dir, title, n) =>
  `<button class="sort${dir ? " on" : ""}" ${attrs} title="${esc(title)}" aria-label="${esc(title)}">${SORT_ICON[dir]}${n}</button>`;

// Sticky header rows and row-header columns need pixel offsets.
function measureSticky() {
  const grid = $("grid");
  if (!grid.tHead) return;
  let t = 0;
  [...grid.tHead.rows].forEach((tr, i) => { grid.style.setProperty(`--t${i}`, t + "px"); t += tr.getBoundingClientRect().height; });
  let l = 0;
  grid.querySelectorAll("th.rlabel").forEach((th, i) => { grid.style.setProperty(`--l${i}`, l + "px"); l += th.getBoundingClientRect().width; });
  grid.style.setProperty("--lsum", l + "px");
}

function renderShelves() {
  if (!layout) return;
  const vis = model ? visibleMeasures() : [];
  const pill = id => id === MEAS
    ? `<span class="pill meas-names${vis.length ? "" : " empty"}" tabindex="0" data-drag="${MEAS}" data-kind="meas" data-id="${MEAS}" title="Drag to move all measures">Measure Names</span>`
    : `<span class="pill" tabindex="0" data-drag="${esc(id)}" data-kind="dim" data-id="${esc(id)}" title="Drag to move">${esc(levelName(id))}</span>`;
  const empty = `<span class="ph">Drag fields here</span>`;
  $("pillsCols").innerHTML = layout.cols.filter(id => !isOff(id)).map(pill).join("") || empty;
  $("pillsRows").innerHTML = layout.rows.filter(id => !isOff(id)).map(pill).join("") || empty;
  $("pillsValues").innerHTML = layout.measures.filter(id => !isOff(id)).map(id => {
    const off = layout.hidden.includes(id);
    return `<span class="pill measure${off ? " off" : ""}" tabindex="0" data-drag="${esc(id)}" data-kind="measure" data-id="${esc(id)}"
      title="Drag to reorder. Click to ${off ? "show" : "hide"}.">${esc(model.measById.get(id).label)}</span>`;
  }).join("") || `<span class="ph">Drag measures here</span>`;

  const availDims = model ? model.dims.filter(d => !d.off && !layout.rows.includes(d.id) && !layout.cols.includes(d.id)) : [];
  // LOD helper measures only feed totals, so they stay out of the field list.
  const helpers = new Set(model ? model.measures.flatMap(m => m.rule === "lod" ? m.lods.map(l => model.measures[l.idx].id) : []) : []);
  const availMeas = model ? model.measures.filter(m => !m.off && !m.helper && !helpers.has(m.id) && !layout.measures.includes(m.id)) : [];
  const byLabel = (a, b) => a.label.localeCompare(b.label, undefined, { numeric: true, sensitivity: "base" });

/* ---------- Excel export: exactly what's on screen ---------- */
function loadXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((resolve, reject) => {
    const sc = document.createElement("script");
    sc.src = "./xlsx.full.min.js";
    sc.onload = () => resolve(window.XLSX);
    sc.onerror = () => reject(new Error("the Excel library (xlsx.full.min.js) didn't load"));
    document.head.appendChild(sc);
  });
}

async function exportExcel() {
  if (!model || !layout) return;
  const btn = $("btnExport");
  btn.disabled = true;
  try {
    const XLSX = await loadXlsx();
    const g = buildGrid();
    const { rowLv, colLv, rowItems, colItems, text } = g;
    const nRH = Math.max(rowLv.length, 1), nCH = Math.max(colLv.length, 1);
    const title = worksheet ? worksheet.name : "Pivot Grid";
    const now = new Date();
    const aoa = [[title], ["Exported " + now.toLocaleString()], []];
    const merges = [], top = aoa.length;
    const merge = (r, c, rows, cols) => { if (rows > 1 || cols > 1) merges.push({ s: { r, c }, e: { r: r + rows - 1, c: c + cols - 1 } }); };

    const cFD = firstDiff(colItems.map(c => c.t)), rFD = firstDiff(rowItems.map(r => r.t));
    for (let L = 0; L < nCH; L++) {
      const row = new Array(nRH + colItems.length).fill(null);
      row[0] = colLv[L] ? levelName(colLv[L]) : "";
      merge(top + L, 0, 1, nRH);
      const runs = runLens(cFD, L);
      for (let c = 0; c < colItems.length; c++) {
        if (!runs[c]) continue;
        row[nRH + c] = colLv.length ? text(colLv, colItems[c], L) : "";
        merge(top + L, nRH + c, 1, runs[c]);
      }
      aoa.push(row);
    }
    aoa.push(rowLv.map(levelName));
    const rRuns = rowLv.map((_, i) => runLens(rFD, i));
    rowItems.forEach((it, r) => {
      const row = [];
      const at = aoa.length;
      for (let i = 0; i < nRH; i++) {
        if (!rowLv.length) { row.push(null); continue; }
        const n = layout.grouped ? rRuns[i][r] : 1;
        row.push(n ? text(rowLv, it, i) : null);
        if (n) merge(at, i, n, 1);
      }
      for (const c of colItems) {
        const cell = g.cell(it, c);
        const mi = rowLv.includes(MEAS) ? it.t[rowLv.indexOf(MEAS)] : colLv.includes(MEAS) ? c.t[colLv.indexOf(MEAS)] : -1;
        const meas = mi >= 0 && g.vis[mi];
        const fmt = meas ? g.fmtOf(mi) : null;
        row.push(typeof cell.s === "number" && isFinite(cell.s) ? { t: "n", v: cell.s, z: (fmt && fmt.xl) || "General" } : cell.f || null);
      }
      aoa.push(row);
    });

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!merges"] = merges;
    const width = i => Math.min(60, Math.max(8, ...aoa.slice(top).map(r => {
      const v = r[i]; return v == null ? 0 : String(typeof v === "object" ? (v.v ?? "") : v).length + 2;
    })));
    ws["!cols"] = Array.from({ length: nRH + colItems.length }, (_, i) => ({ wch: width(i) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, title.replace(/[\\/?*:[\]]/g, " ").slice(0, 31) || "Sheet1");
    const day = now.toISOString().slice(0, 10);
    XLSX.writeFile(wb, `${title.replace(/[\\/:*?"<>|]+/g, "_")}_${day}.xlsx`);
  } catch (err) {
    setNotice("Export failed: " + err.message + ". Try again, or reload the sheet.", true);
    console.error(err);
  } finally {
    btn.disabled = false;
  }
}
